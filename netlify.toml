# Chain Explorer — Netlify static frontend
# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# The FastAPI backend is not run on Netlify. Host it separately (see render.yaml)
# and set CHAIN_API_URL in Netlify → Environment variables, then redeploy.
# The build enables same-origin API proxy by default (CHAIN_NETLIFY_PROXY=true).

# Base directory is frontend/ so Netlify does not auto-install root
# requirements.txt (FastAPI backend deps). The static build only copies
# frontend assets and injects CHAIN_API_URL — no Python packages needed.
[build]
  base = "frontend"
  command = "bash ../scripts/netlify-build.sh"
  publish = "../dist/netlify"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"
