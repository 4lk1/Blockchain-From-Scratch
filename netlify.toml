# Chain Explorer — Netlify static frontend
# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# The FastAPI backend is not run on Netlify. Host it separately and set
# CHAIN_API_URL in the Netlify environment, or enable CHAIN_NETLIFY_PROXY=true
# to proxy API routes through Netlify (see scripts/netlify-build.sh).

[build]
  command = "bash scripts/netlify-build.sh"
  publish = "dist/netlify"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"
